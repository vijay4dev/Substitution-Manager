kind = "web"
previewPath = "/"
title = "Substitution Manager"
version = "1.0.0"
id = "artifacts/substitution-manager"
router = "path"

[[services]]
name = "web"
paths = [ "/" ]
localPort = 23558

[services.development]
run = "pnpm --filter @workspace/substitution-manager run dev"

[services.production]
build = [ "pnpm", "--filter", "@workspace/substitution-manager", "run", "build" ]
serve = "static"
publicDir = "artifacts/substitution-manager/dist/public"

[[services.production.rewrites]]
from = "/*"
to = "/index.html"

[services.env]
PORT = "23558"
BASE_PATH = "/"
